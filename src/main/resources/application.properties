# Servidor local
server.port=3000

# Conexión JDBC a base de datos Supabase
spring.datasource.url=${SUPABASE_URL}
spring.datasource.username=${SUPABASE_USER}
spring.datasource.password=${SUPABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Azure Blob Storage
azure.storage.connection-string=DefaultEndpointsProtocol=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.container-name=movimientos

# Mail (reporte por correo)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@arriendosya.local}

# Logging
logging.level.root=INFO
logging.level.com.arriendos_ya_back=DEBUG
logging.level.com.azure.storage=DEBUG